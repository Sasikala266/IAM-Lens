name: Deploy Documentation to GitHub Pages

on:
  # Run on pushes to main branch
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/deploy-docs.yml'
  
  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create documentation site structure
        run: |
          mkdir -p _site
          
          # Copy main README to index
          cp README.md _site/index.md
          
          # Copy docs folder
          cp -r docs/* _site/ 2>/dev/null || echo "No docs folder found, using README only"
          
          # Create a simple index.html that redirects to the rendered markdown
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>IAM Audit Utility (IAM-Lens) - Documentation</title>
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">
            <style>
              .markdown-body { box-sizing: border-box; min-width: 200px; max-width: 980px; margin: 0 auto; padding: 45px; }
            </style>
          </head>
          <body>
            <article class="markdown-body">
              <h1>IAM Audit Utility (IAM-Lens)</h1>
              <p>Documentation site for IAM-Lens project.</p>
              <ul>
                <li><a href="ARCHITECTURE.html">Architecture Documentation</a></li>
                <li><a href="FEATURES.html">Features</a></li>
                <li><a href="USAGE.html">Usage Guide</a></li>
              </ul>
            </article>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        
      - name: Deployment Status
        if: failure()
        run: |
          echo "::warning::GitHub Pages deployment failed. This may be a transient issue."
          echo "If you see a 503 error, GitHub Pages service might be temporarily unavailable."
          echo "Please check https://www.githubstatus.com/ and retry the deployment."
          echo ""
          echo "To retry: Go to Actions tab → Deploy Documentation to GitHub Pages → Re-run failed jobs"
          exit 1
